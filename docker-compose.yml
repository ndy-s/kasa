services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kasa 
      POSTGRES_PASSWORD: kasa
      POSTGRES_DB: kasa
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://kasa:kasa@postgres:5432/kasa?sslmode=disable
      JWT_SECRET: change-me
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  pgdata:
