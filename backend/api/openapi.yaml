openapi: 3.0.3
info:
  title: Kasa API
  version: 0.1.0
  description: A simplified but correct retail core banking system.
servers:
  - url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Liveness and database readiness
      responses:
        "200": { description: OK }
        "503": { description: Database unreachable }
  /register:
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /login:
    post:
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        "401": { $ref: "#/components/responses/Error" }
  /me:
    get:
      summary: The authenticated customer
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Error" }
  /accounts:
    post:
      summary: Open an account against a product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code]
              properties:
                product_code: { type: string, example: SAV }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "401": { $ref: "#/components/responses/Error" }
  /accounts/{id}:
    get:
      summary: Get an account by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Account" }
        "404": { $ref: "#/components/responses/Error" }
  /accounts/{id}/balances:
    get:
      summary: The account's ledger, holds, and available balance
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledger: { type: string, example: "500.00 IDR" }
                  holds: { type: string, example: "0.00 IDR" }
                  available: { type: string, example: "500.00 IDR" }
        "404": { $ref: "#/components/responses/Error" }
  /accounts/{id}/transactions:
    get:
      summary: List an account's journal entries, most recent first
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EntrySummary" }
        "404": { $ref: "#/components/responses/Error" }
  /transactions/{id}/journal:
    get:
      summary: A journal entry's debit/credit lines, for the journal inspector
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Journal" }
        "404": { $ref: "#/components/responses/Error" }
  /accounts/{id}/statement:
    get:
      summary: Generate a statement for a period (opening balance, lines, closing balance)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Statement" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /accounts/{id}/deposit:
    post:
      summary: Deposit funds into an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, example: "100.00" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /accounts/{id}/withdraw:
    post:
      summary: Withdraw funds from an account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: string, example: "50.00" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /transfers:
    post:
      summary: Transfer funds between two accounts
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: A client-generated key. A retry with the same key and body replays the original response; the same key with a different body returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from_account_id, to_account_id, amount]
              properties:
                from_account_id: { type: string, format: uuid }
                to_account_id: { type: string, format: uuid }
                amount: { type: string, example: "25.00" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /admin/clock/advance:
    post:
      summary: Fast-forward the time machine, running interest accrual for each day
      description: Admin/learn-mode only. In production, accrual runs on a cron rather than being triggered by a client.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [days]
              properties:
                days: { type: integer, minimum: 1, example: 30 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date }
        "400": { $ref: "#/components/responses/Error" }
  /admin/interest/capitalize:
    post:
      summary: Capitalize accrued interest for every active deposit account on demand
      description: Admin/learn-mode only. In production, capitalization runs on a monthly schedule.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: string, format: date }
  /loans:
    post:
      summary: Originate a loan, disbursing the principal into a deposit account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_code, deposit_account_id, principal, term_months]
              properties:
                product_code: { type: string, example: PL }
                deposit_account_id: { type: string, format: uuid }
                principal: { type: string, example: "12000000.00" }
                term_months: { type: integer, minimum: 1, example: 12 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "400": { $ref: "#/components/responses/Error" }
  /loans/{id}:
    get:
      summary: Get a loan by id
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Loan" }
        "404": { $ref: "#/components/responses/Error" }
  /loans/{id}/schedule:
    get:
      summary: The loan's full amortization schedule
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Installment" }
        "404": { $ref: "#/components/responses/Error" }
  /loans/{id}/repay:
    post:
      summary: Pay the next due installment out of the loan's deposit account
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  entry_id: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /education/scenarios/{name}/run:
    post:
      summary: Run a scripted scenario against real service calls and narrate each step
      security:
        - bearerAuth: []
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string, enum: [insufficient-funds, reversal] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scenario: { type: string }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        action: { type: string }
                        result: { type: string }
                        detail: { type: string }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Customer:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, enum: [pending, active, suspended] }
    Account:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, active, frozen, closed] }
        currency: { type: string, example: IDR }
    EntrySummary:
      type: object
      properties:
        entry_id: { type: string, format: uuid }
        type: { type: string, example: deposit }
        description: { type: string }
        booking_date: { type: string, format: date }
    JournalLine:
      type: object
      properties:
        account_id: { type: string, format: uuid }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: string, example: "100.00 IDR" }
    Journal:
      type: object
      properties:
        entry_id: { type: string, format: uuid }
        type: { type: string, example: deposit }
        lines:
          type: array
          items: { $ref: "#/components/schemas/JournalLine" }
        balanced: { type: boolean }
    StatementLine:
      type: object
      properties:
        booking_date: { type: string, format: date }
        type: { type: string, example: deposit }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: string, example: "100.00 IDR" }
    Statement:
      type: object
      properties:
        opening: { type: string, example: "500.00 IDR" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/StatementLine" }
        closing: { type: string, example: "600.00 IDR" }
    Loan:
      type: object
      properties:
        id: { type: string, format: uuid }
        deposit_account_id: { type: string, format: uuid }
        principal: { type: string, example: "12000000.00 IDR" }
        term_months: { type: integer, example: 12 }
        interest_rate_bps: { type: integer, example: 1800 }
        status: { type: string, enum: [active, closed] }
        disbursed_at: { type: string, format: date }
    Installment:
      type: object
      properties:
        number: { type: integer }
        due_date: { type: string, format: date }
        principal: { type: string, example: "922625.66 IDR" }
        interest: { type: string, example: "177534.25 IDR" }
        total: { type: string, example: "1100159.91 IDR" }
        balance: { type: string, example: "11077374.34 IDR" }
        status: { type: string, enum: [due, paid] }
    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
