version: "2"

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - depguard
  settings:
    depguard:
      rules:
        main:
          files:
            - "$all"
          deny:
            - pkg: "gorm.io/gorm"
              desc: "no ORM in this project, use pgx/sqlc directly (see plan ADR-004)"
        domain:
          files:
            - "**/internal/customer/domain.go"
            - "**/internal/customer/service.go"
          deny: 
            - pkg: "github.com/jackc/pgx"
              desc: "domain/application code must not import pgx; go through the Repository port"
            - pkg: "net/http"
              desc: "domain/application code must not import net/http; that belongs in http.go"
            - pkg: "github.com/go-chi/chi"
              desc: "domain/application code must not import chi"
